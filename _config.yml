title: Career Search Advice
description: A practical workflow for career inventories, company research, and targeted resumes.
remote_theme: pages-themes/midnight@v0.2.0
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
header_pages:
  - docs/index.md
  - docs/interview-process.md
  - docs/master-inventory.md
  - docs/github-setup.md
  - docs/opportunity-evaluation.md
  - docs/resume-generation.md
  - docs/example.md
